---
name: Check Pull Request
permissions:
  security-events: write
  pull-requests: write
  packages: read
  actions: read
  contents: read
  deployments: write
  issues: write
  checks: write
  statuses: write # Used by CM to mark commit status

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  code_checks:
    if: github.event_name == 'pull_request'
    uses: yaperos/reusable-workflows/.github/workflows/pr_checks.yaml@main
    secrets: inherit

