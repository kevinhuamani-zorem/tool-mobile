---
name: CodeQL Main Branch Push Checks
permissions:
  security-events: write
  pull-requests: write # Necessary for code_scanner.yaml:dependency_review as of 20250319
  packages: read
  actions: read
  contents: read
  deployments: write
  issues: write
  checks: write
  statuses: write # Used by CM to mark commit status

on:
  push:
    branches:
      - main
      - release/**

jobs:
  code_checks:
    if: github.event_name == 'push'  || github.event_name == 'workflow_dispatch'
    uses: yaperos/reusable-workflows/.github/workflows/push_checks.yaml@main
    secrets: inherit

