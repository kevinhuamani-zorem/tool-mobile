---
name: CodeQL Main Branch Scheduled Checks
permissions:
  security-events: write
  pull-requests: write # Necessary for code_scanner.yaml:dependency_review as of 20250319
  packages: read
  actions: read
  contents: read
  deployments: write
  issues: write
  checks: write
  statuses: write # Used by CM to mark commit status

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scheduled_checks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: yaperos/reusable-workflows/.github/workflows/codeql_scheduler_helper_loadinputs.yaml@main
    secrets: inherit

